<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="slider-container">
        <input type="radio" name="slider" id="slide_1">
        <input type="radio" name="slider" id="slide_2">
        <input type="radio" name="slider" id="slide_3">
        <input type="radio" name="slider" id="slide_4">
        <input type="radio" name="slider" id="slide_5">
        <input type="radio" name="slider" id="slide_6">
        <input type="radio" name="slider" id="slide_7">
        <input type="radio" name="slider" id="slide_8">
        <div class="slider-body">
            <div class="slides">
                <img src="assets/images/1.avif" alt="meme_1">
                <img src="assets/images/2.avif" alt="meme_2">
                <img src="assets/images/3.avif" alt="meme_3">
                <img src="assets/images/4.avif" alt="meme_4">
                <img src="assets/images/5.avif" alt="meme_5">
                <img src="assets/images/6.avif" alt="meme_6">
                <img src="assets/images/7.avif" alt="meme_7">
                <img src="assets/images/8.avif" alt="meme_8">
            </div>
        </div>
        <div class="slider-controls">
            <div class="captions-container">
                <span class="caption txt_1"></span>
                <span class="caption txt_2"></span>
                <span class="caption txt_3"></span>
                <span class="caption txt_4"></span>
                <span class="caption txt_5"></span>
                <span class="caption txt_6"></span>
                <span class="caption txt_7"></span>
                <span class="caption txt_8"></span>
            </div>
            <div class="controls-container">
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_1" class="control_space btn_1"></label>
            </div>
        </div>
    </div>

</body>

</html>
