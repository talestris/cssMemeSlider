<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssMemeSlider</title>
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="slider-container">
        <input type="radio" name="slider" id="slide_1" checked>
        <input type="radio" name="slider" id="slide_2">
        <input type="radio" name="slider" id="slide_7">
        <input type="radio" name="slider" id="slide_8">
        <div class="slider-body">
            <div class="slides">
                <img src="assets/images/1.avif" alt="meme_1">
                <img src="assets/images/2.avif" alt="meme_2">
                <img src="assets/images/7.avif" alt="meme_7">
                <img src="assets/images/8.avif" alt="meme_8">
            </div>
        </div>
        <div class="slider-controls">
            <div class="captions-container">
                <span class="caption txt_1">When you start your assignment<br>an hour before the deadline</span>
                <span class="caption txt_2">And then I said: "I completely<br>understand your frustration"</span>
                <span class="caption txt_7">Throwback to when my dad<br>forgot I'm a doctor</span>
                <span class="caption txt_8">Me after graduation<br>me after working for 2 years</span>
            </div>
            <div class="controls-container">
                <label for="slide_1" class="control_space btn_1"></label>
                <label for="slide_2" class="control_space btn_2"></label>
                <label for="slide_7" class="control_space btn_7"></label>
                <label for="slide_8" class="control_space btn_8"></label>
            </div>
        </div>
    </div>

</body>

</html>
